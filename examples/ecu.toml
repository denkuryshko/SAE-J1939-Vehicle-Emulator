[bus]
mode = "virtual"          # "real" | "virtual"
channel = "vcan0"
bitrate = 500000
start_on_launch = true

[ecu]
source_address = 0x00
# J1939-81 NAME (claimed on the bus), built from these fields:
industry_group = 1        # 1 = On-Highway
vehicle_system = 0        # 0 = Non-specific
function = 0              # 0 = Engine
manufacturer_code = 0
identity_number = 0

[vehicle]
vin = "1HTMMAAL5GH123456"
persist_meters = true    # keep odometer / engine hours per VIN between runs
ignition = "run"         # "run" = engine running | "on" = key ON, engine off (0 rpm / 0 mph)

# DTCs the Diagnostics tab can inject (sent on DM1 while active; DM11 clears them).
# lamp = "amber" | "red" | "mil" | "protect"; oc = occurrence count; active = on at launch.
[[diagnostics.dtc]]
spn = 110
fmi = 3
lamp = "amber"
name = "Engine Coolant Temp Voltage High"
description = "Voltage Above Normal, Or Shorted To High Source."

[[diagnostics.dtc]]
spn = 190
fmi = 0
lamp = "red"
name = "Engine Crankshaft Overspeed"
description = "Data Valid But Above Normal Operational Range - Most Severe Level."

[pgn.eec1]
enabled = true
cycle_ms = 20
spn190_rpm = 0

[pgn.ccvs]
enabled = true
cycle_ms = 100
spn84_speed_mph = 0

[pgn.vd]
enabled = true
cycle_ms = 1000
spn245_total_mi = 248912.4

[pgn.hrvd]
enabled = true
cycle_ms = 1000

[pgn.hours]
enabled = true
cycle_ms = 1000
spn247_engine_hours = 10000.0
