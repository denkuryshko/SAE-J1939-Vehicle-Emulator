[bus]
mode = "virtual"          # "real" | "virtual"
channel = "vcan0"
bitrate = 500000
start_on_launch = true

[ecu]
source_address = 0x00
# J1939-81 NAME (claimed on the bus), built from these fields:
industry_group = 1        # 1 = On-Highway
vehicle_system = 0        # 0 = Non-specific
function = 0              # 0 = Engine
manufacturer_code = 0
identity_number = 0

[vehicle]
vin = "1HTMMAAL5GH123456"
persist_meters = true    # keep odometer / engine hours per VIN between runs

[diagnostics]
dtc_spn110_fmi3 = false
dtc_spn190_fmi0 = false

[pgn.eec1]
enabled = true
cycle_ms = 20
spn190_rpm = 0

[pgn.ccvs]
enabled = true
cycle_ms = 100
spn84_speed_mph = 0

[pgn.vd]
enabled = true
cycle_ms = 1000
spn245_total_mi = 248912.4

[pgn.hours]
enabled = true
cycle_ms = 1000
spn247_engine_hours = 10000.0
