# Конфіг під CANable (candleLight) + ELD, J1939 250 kbit/s
# Запуск: .venv\Scripts\python.exe -m j1939_emulator --gui --config my_ecu.toml

[bus]
mode = "real"
channel = "003A002B5946570920393630:0"   # candleLight за серійним номером (не залежить від порядку адаптерів)
bitrate = 250000
start_on_launch = false   # START натискаєте самі в GUI

[ecu]
source_address = 0x00
# J1939-81 NAME (claimed on the bus), built from these fields:
industry_group = 1        # 1 = On-Highway
vehicle_system = 0        # 0 = Non-specific
function = 0              # 0 = Engine
manufacturer_code = 0
identity_number = 0

[vehicle]
vin = "1HTMMAAL7HF251808"
persist_meters = true    # keep odometer / engine hours per VIN between runs
ignition = "run"         # "run" = engine running | "on" = key ON, engine off (0 rpm / 0 mph)

[diagnostics]
dtc_spn110_fmi3 = false
dtc_spn190_fmi0 = false

# Старт: двигун працює на холостих, авто стоїть
[pgn.eec1]
enabled = true
cycle_ms = 20
spn190_rpm = 800

[pgn.ccvs]
enabled = true
cycle_ms = 100
spn84_speed_mph = 0       # миль/год (60 км/год ≈ 37.3 mph)

[pgn.vd]
enabled = true
cycle_ms = 1000
spn245_total_mi = 248912.4   # одометр, милі

[pgn.hrvd]
enabled = true
cycle_ms = 1000

[pgn.hours]
enabled = true
cycle_ms = 1000
spn247_engine_hours = 10000.0
